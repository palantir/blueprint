packages:
  - "packages/*"

catalog:
  classnames: ^2.3.1
  tslib: ~2.6.2
  # Test dependencies - centralized versions
  "@testing-library/dom": ^10.4.0
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.1.0
  "@testing-library/user-event": ^14.6.1
  "@vitejs/plugin-react": ^5.1.0
  "@vitest/coverage-v8": 4.0.7
  enzyme: ^3.11.0
  jsdom: ^27.1.0
  tsx: ^4.21.0
  vitest: 4.0.7

# Supply chain security
minimumReleaseAge: 4320 # 3 days in minutes
blockExoticSubdeps: true
gitChecks: false
overrides:
  "@types/react": 18.3.12
  cheerio: 0.22.0
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  core-js-pure: false
  esbuild: false
  nx: false
  ttf2woff2: false
