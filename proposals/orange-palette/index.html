                &lt;div&gt;
                    &lt;p&gt;
                        Hue, lightness and chroma edit orange’s center color. The contrast lock solves lightness for the
                        chosen white-text ratio. If a color is outside sRGB, chroma is reduced while keeping its
                        lightness and hue direction.
                    &lt;/p&gt;
                    &lt;p&gt;
                        The ten-step trial ramp keeps the center at 500. Step size controls the nearby 400/600/700
                        shades; the rest extends to light and dark tinted endpoints. Hover and selected always come from
                        this displayed ramp.
                    &lt;/p&gt;
                    &lt;p&gt;
                        “Regenerate from orange” keeps each BP6 family’s hue, matches its center luminance to orange,
                        and shares orange’s relative lightness spacing and chroma profile. Neutral grays stay fixed.
                        This is an experimental model inspired by Ryan, not a reproduction of his quadratic recipe or
                        CIECAM02 dark-mode compensation.
                    &lt;/p&gt;
                    &lt;p&gt;
                        Fixed BP6 and Blueprint Next references come from develop commit &lt;code&gt;75a8495&lt;/code&gt;. Next is a
                        repository snapshot, which can differ from the PDF. The Ryan preset loads his orange anchor; it
                        does not claim to reproduce his entire ramp.
                    &lt;/p&gt;
                    &lt;p&gt;
                        The separate Ryan’s orange comparison uses the exact published light and dark orange hex values
                        from his recipe’s reproduction checkpoints. Both oranges share this playground’s role and state
                        assignments, so this comparison isolates the palette; it does not reproduce all of Ryan’s
                        production semantic tokens.
                    &lt;/p&gt;
                    &lt;p&gt;
                        BP6 orange uses its six published colors, ordered 6→1 from light to dark. It is not stretched
                        into a ten-step scale. The comparison initially picks its nearest lightness shade; click a BP6
                        shade to inspect it directly. The BP6 preview rest control chooses 3→2→1 or 5→4→3 in both modes.
                        Current BP6 components also use color adjustments and dark warning labels; this shared preview
                        does not reproduce those production styles.
                    &lt;/p&gt;
                    &lt;p&gt;
                        Hex edits preserve the entered color and release the contrast lock. Saved candidates stay in
                        this conversation when host persistence is available.
                    &lt;/p&gt;
