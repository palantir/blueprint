version: 2.1

parameters:
  run-chromatic:
    type: boolean
    default: false

aliases:
  - &docker-node-image
    - image: cimg/node:24.14.1

  - &restore-pnpm-cache
    name: Restore pnpm store cache
    key: v1-pnpm-store-{{ checksum "pnpm-lock.yaml" }}

  - &save-pnpm-cache
    name: Save pnpm store cache
    paths:
      - ~/.local/share/pnpm/store
    key: v1-pnpm-store-{{ checksum "pnpm-lock.yaml" }}

  - &ci-environment
    TURBO_TELEMETRY_DISABLED: "1"
    DO_NOT_TRACK: "1"

commands:
  # Keys carry CIRCLE_NODE_INDEX because save_cache against an existing key is a silent no-op,
  # so a key shared across parallel containers would only ever persist one container's results.
  # Run after attach_workspace: the compile job's turbo cache for this revision arrives via the
  # workspace, and this layers the job's own previous results on top.
  restore-turbo-cache:
    parameters:
      scope: { type: string }
    steps:
      - restore_cache:
          name: Restore turbo cache (<< parameters.scope >>)
          keys:
            - v1-turbo-{{ arch }}-<< parameters.scope >>-{{ .Environment.CIRCLE_NODE_INDEX }}-{{ .Branch }}-{{ .Revision }}
            - v1-turbo-{{ arch }}-<< parameters.scope >>-{{ .Environment.CIRCLE_NODE_INDEX }}-{{ .Branch }}-
            - v1-turbo-{{ arch }}-<< parameters.scope >>-{{ .Environment.CIRCLE_NODE_INDEX }}-

  # Vitest writes JUnit to packages/<pkg>/reports/junit.xml (cached by turbo with the test task).
  collect-vitest-reports:
    steps:
      - run:
          name: Collect vitest JUnit reports
          when: always
          command: |
            mkdir -p reports
            for f in packages/*/reports/junit.xml; do
              [ -f "$f" ] && cp "$f" "reports/$(basename "$(dirname "$(dirname "$f")")").xml"
            done
            true

  save-turbo-cache:
    parameters:
      scope: { type: string }
    steps:
      - save_cache:
          name: Save turbo cache (<< parameters.scope >>)
          when: always
          key: v1-turbo-{{ arch }}-<< parameters.scope >>-{{ .Environment.CIRCLE_NODE_INDEX }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .turbo/cache

jobs:
  circle-all:
    resource_class: small
    docker: *docker-node-image
    steps:
      - checkout
      - run:
          name: Validate policy file
          command: |
            rcode=$(curl "https://policy-bot.general.dmz.palantir.tech/api/validate" -XPUT -T ".policy.yml" -s -w "%{http_code}" -o /tmp/response)
            if [[ "${rcode}" -gt 299 ]]; then
              jq -r .message < /tmp/response && exit 1
            fi

  checkout-code:
    docker: *docker-node-image
    steps:
      - checkout
      - restore_cache: *restore-pnpm-cache
      - run: sudo corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm store prune
      - save_cache: *save-pnpm-cache
      - persist_to_workspace:
          root: "."
          paths:
            - node_modules
            - packages/*/node_modules

  clean-lockfile:
    docker: *docker-node-image
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run: pnpm dedupe --check

  compile:
    docker: *docker-node-image
    resource_class: xlarge
    environment: *ci-environment
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - restore-turbo-cache: { scope: compile }
      # Includes docs-data so its cache entry reaches downstream jobs (lint, dist) via the workspace.
      - run: pnpm exec turbo run compile
      - save-turbo-cache: { scope: compile }
      - persist_to_workspace:
          root: "."
          paths:
            - .turbo/cache
            - packages/*/lib
            - packages/core/src/design-tokens/build
            - packages/icons/src/generated
            - packages/icons/src/next/generated

  compile-docs:
    docker: *docker-node-image
    environment:
      <<: *ci-environment
      JUNIT_REPORT_PATH: reports
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      # docs-data is built (and cached) by the compile job; this only runs its tests.
      - restore-turbo-cache: { scope: compile-docs }
      - run: pnpm exec turbo run test:vitest:run --filter=@blueprintjs/docs-data
      - save-turbo-cache: { scope: compile-docs }
      - collect-vitest-reports
      - store_test_results: { path: ./reports }

  format-check:
    docker: *docker-node-image
    environment:
      JUNIT_REPORT_PATH: reports
      NODE_ENV: test
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - restore_cache:
          name: Restore prettier cache
          keys:
            - v1-prettier-{{ .Branch }}-{{ .Revision }}
            - v1-prettier-{{ .Branch }}-
            - v1-prettier-
      - run: pnpm format-check
      - save_cache:
          name: Save prettier cache
          when: always
          key: v1-prettier-{{ .Branch }}-{{ .Revision }}
          paths:
            - node_modules/.cache/prettier

  lint:
    docker: *docker-node-image
    resource_class: large
    environment:
      <<: *ci-environment
      JUNIT_REPORT_PATH: reports
      NODE_ENV: test
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run: mkdir -p ./reports/eslint ./reports/stylelint
      # lint depends on ^compile; those tasks are cache hits from the compile job's turbo cache
      - restore-turbo-cache: { scope: lint }
      - run:
          command: pnpm exec turbo run lint
          no_output_timeout: 20m
      - save-turbo-cache: { scope: lint }
      - store_test_results: { path: ./reports }
      - store_artifacts: { path: ./reports }

  dist:
    docker: *docker-node-image
    resource_class: xlarge
    environment:
      <<: *ci-environment
      NODE_ENV: test
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - restore-turbo-cache: { scope: dist }
      - run: pnpm exec turbo run dist
      - persist_to_workspace:
          root: "."
          paths: [packages/*/lib, packages/*/dist]
      - run: pnpm build-storybook
      - save-turbo-cache: { scope: dist }
      - persist_to_workspace:
          root: "."
          paths: [storybook-static]

  test-node-libs:
    docker: *docker-node-image
    environment:
      <<: *ci-environment
      JUNIT_REPORT_PATH: reports
    parallelism: 2
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run: mkdir -p ./reports
      - restore-turbo-cache: { scope: test-node-libs }
      - run:
          command: |
            case $CIRCLE_NODE_INDEX in \
            0) pnpm exec turbo run test --filter=@blueprintjs/eslint-plugin ;; \
            1) pnpm exec turbo run test --filter=@blueprintjs/stylelint-plugin ;; \
            esac
          when: always
      - save-turbo-cache: { scope: test-node-libs }
      - store_test_results: { path: ./reports }
      - store_artifacts: { path: ./reports }

  type-check-icons:
    docker: *docker-node-image
    resource_class: xlarge
    environment: *ci-environment
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      # Icons type checking needs generated sources and test helpers, so it can overlap library compilation.
      # Runs icons:verify and generate-icon-src first (see packages/icons/turbo.json).
      - restore-turbo-cache: { scope: type-check-icons }
      - run: pnpm exec turbo run test:typeCheck --filter=@blueprintjs/icons
      - save-turbo-cache: { scope: type-check-icons }

  test-react-18: &test-react
    docker: *docker-node-image
    resource_class: xlarge
    environment:
      <<: *ci-environment
      JUNIT_REPORT_PATH: reports
    parallelism: 6
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run: mkdir -p ./reports
      - restore-turbo-cache: { scope: test-react-18 }
      - run:
          # split vitest tests into containers because they can take up a lot of memory
          # Originally did this while tests were still running on Karma because running
          # them in one container caused Karma to time out frequently
          # see https://github.com/palantir/blueprint/issues/3616
          # Task dependencies are cache hits from the compile job's turbo cache.
          # Avoid `--` args here: turbo forwards them to, and hashes them into, every task in the run.
          command: |
            case $CIRCLE_NODE_INDEX in
            0) pnpm exec turbo run test:typeCheck --filter='!@blueprintjs/icons' ;;
            1) pnpm exec turbo run test:vitest:run --filter=@blueprintjs/core ;;
            2) pnpm exec turbo run test:vitest:run --filter=@blueprintjs/datetime ;;
            3)
              pnpm exec turbo run test:vitest:run --filter=@blueprintjs/icons &&
              pnpm exec turbo run test --filter=@blueprintjs/labs
              ;;
            4) pnpm exec turbo run test:vitest:run --filter=@blueprintjs/select ;;
            5) pnpm exec turbo run test:vitest:run --filter=@blueprintjs/table ;;
            *) echo "Unexpected test shard: $CIRCLE_NODE_INDEX" >&2; exit 1 ;;
            esac
          when: always
      - save-turbo-cache: { scope: test-react-18 }
      - collect-vitest-reports
      - store_test_results: { path: ./reports }
      - store_artifacts: { path: ./reports }

  test-iso-react-18: &test-iso
    docker: *docker-node-image
    environment:
      <<: *ci-environment
      JUNIT_REPORT_PATH: reports
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run: mkdir ./reports
      - restore-turbo-cache: { scope: test-iso-react-18 }
      - run: pnpm exec turbo run test:iso
      - save-turbo-cache: { scope: test-iso-react-18 }
      - store_test_results: { path: ./reports }
      - store_artifacts: { path: ./reports }

  chromatic:
    docker: *docker-node-image
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run:
          # Checks for the project token for Chromatic, which is not available to forked repos
          name: Check chromatic project token available
          command: |
            if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
              echo "Skipping Chromatic (no project token — likely a fork build)"
              exit 0
            fi
            pnpm exec chromatic --storybook-build-dir storybook-static --exit-zero-on-changes --only-changed --trace-changed

  deploy-preview:
    docker: *docker-node-image
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - store_artifacts: { path: packages/docs-app/dist }
      - store_artifacts: { path: packages/landing-app/dist }
      - store_artifacts: { path: packages/table-dev-app/dist }
      - store_artifacts: { path: packages/demo-app/dist }
      - store_artifacts: { path: storybook-static }

  store-packages:
    docker: *docker-node-image
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run: mkdir ./artifacts
      - run: ./scripts/pack-npm
      - store_artifacts: { path: ./artifacts }

  deploy-npm:
    docker: *docker-node-image
    steps:
      - checkout
      - attach_workspace: { at: "." }
      - run: sudo corepack enable
      - run:
          command: |
            # From https://docs.npmjs.com/trusted-publishers#circleci-configuration
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            ./scripts/publish-npm-semver-tagged

workflows:
  compile_lint_test_dist_deploy:
    unless: << pipeline.parameters.run-chromatic >>
    jobs:
      - circle-all:
          requires: [dist, lint, compile-docs, test-node-libs, type-check-icons, test-react-18, test-iso-react-18]
      - checkout-code
      - clean-lockfile:
          requires: [checkout-code]
      - compile:
          requires: [checkout-code]
      - format-check:
          requires: [checkout-code]
      - lint:
          requires: [compile]
      - compile-docs:
          requires: [compile]
      - dist:
          requires: [compile]
      - test-node-libs:
          requires: [compile]
      - type-check-icons:
          requires: [checkout-code]
      - test-react-18:
          requires: [compile]
      - test-iso-react-18:
          requires: [compile]
      - chromatic:
          requires: [dist]
          filters:
            branches:
              only: develop
      - deploy-preview:
          requires: [dist]
      - store-packages:
          requires: [dist]
      - deploy-npm:
          requires: [dist, lint, compile-docs, test-node-libs, type-check-icons, test-react-18, test-iso-react-18]
          filters:
            branches:
              only:
                - develop
                - next
                - /^release\/.*/
  chromatic-on-demand:
    when: << pipeline.parameters.run-chromatic >>
    jobs:
      - checkout-code
      - compile:
          requires: [checkout-code]
      - dist:
          requires: [compile]
      - chromatic:
          requires: [dist]
