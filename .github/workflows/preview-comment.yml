name: Preview Comment

# CircleCI's deploy-preview job stores the built apps as artifacts and reports a
# commit status. This turns a successful status into a PR comment linking them.
# `status` workflows always run develop's copy of this file, so PR code never
# runs next to the write token.
on: [status, pull_request] # TEMP: pull_request for testing PR #8410

permissions: {}

jobs:
  comment:
    name: Comment with preview links
    if: "github.event_name == 'pull_request' && github.event.pull_request.number == 8410 || github.event.context == 'ci/circleci: deploy-preview' && github.event.state == 'success'"
    timeout-minutes: 60 # TEMP: was 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: "TEMP: wait for the deploy-preview status"
        id: wait
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 110); do
            url=$(gh api "repos/palantir/blueprint/commits/$HEAD_SHA/statuses" --jq '[.[] | select(.context == "ci/circleci: deploy-preview")][0] | select(.state == "success") | .target_url')
            if [ -n "$url" ]; then
              # Let develop's status-triggered workflow finish before replacing its warning comment.
              sleep 15
              echo "target_url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Comment with preview links
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha || github.event.pull_request.head.sha }}
          TARGET_URL: ${{ github.event.target_url || steps.wait.outputs.target_url }}
        run: |
          set -euo pipefail
          repo=palantir/blueprint

          # Anyone with write access can post a status, so take only the workflow
          # and job UUIDs from it and confirm with CircleCI that the job really is
          # a successful deploy-preview of this commit.
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || \
            ! [[ "$TARGET_URL" =~ ^https://app\.circleci\.com/workflow/($uuid)/job/($uuid)$ ]]; then
            echo "Unexpected status: sha '$SHA', target_url '$TARGET_URL'."
            exit 1
          fi
          workflow_id="${BASH_REMATCH[1]}"
          job_id="${BASH_REMATCH[2]}"

          workflow=$(curl -fsS "https://circleci.com/api/v2/workflow/$workflow_id")
          read -r workflow_project pipeline_id <<< "$(jq -r '[.project_slug, .pipeline_id] | @tsv' <<< "$workflow")"
          if [ "$workflow_project" != gh/palantir/blueprint ] || ! [[ "$pipeline_id" =~ ^$uuid$ ]]; then
            echo "CircleCI workflow $workflow_id does not belong to gh/palantir/blueprint."
            exit 1
          fi

          jobs=$(curl -fsS "https://circleci.com/api/v2/workflow/$workflow_id/job")
          read -r name state job_project <<< "$(
            jq -r --arg id "$job_id" '.items[] | select(.id == $id) | [.name, .status, .project_slug] | @tsv' <<< "$jobs"
          )"
          if [ "$name" != deploy-preview ] || [ "$state" != success ] || [ "$job_project" != gh/palantir/blueprint ]; then
            echo "CircleCI job $job_id is '$name' ($state), not a successful Blueprint deploy-preview."
            exit 1
          fi

          pipeline=$(curl -fsS "https://circleci.com/api/v2/pipeline/$pipeline_id")
          read -r pipeline_project revision origin target <<< "$(
            jq -r '[.project_slug, .vcs.revision, .vcs.origin_repository_url, .vcs.target_repository_url] | @tsv' \
              <<< "$pipeline"
          )"
          if [ "$pipeline_project" != gh/palantir/blueprint ] || [ "$revision" != "$SHA" ] || \
            [ "$origin" != https://github.com/palantir/blueprint ] || \
            [ "$target" != https://github.com/palantir/blueprint ]; then
            echo "CircleCI pipeline $pipeline_id is at $revision, not a Blueprint pipeline for $SHA."
            exit 1
          fi

          links=()
          for entry in \
            documentation=packages/docs-app/dist/index.html \
            landing=packages/landing-app/dist/index.html \
            table=packages/table-dev-app/dist/index.html \
            demo=packages/demo-app/dist/index.html \
            storybook=storybook-static/index.html; do
            label="${entry%%=*}"
            path="${entry#*=}"
            url="https://output.circle-artifacts.com/output/job/$job_id/artifacts/0/$path"
            if curl -fsS -o /dev/null "$url"; then
              links+=("<a href=\"$url\">$label</a>")
            else
              echo "CircleCI job $job_id has no valid $path artifact; skipping $label."
            fi
          done
          if [ ${#links[@]} -eq 0 ]; then
            echo "CircleCI job $job_id has no preview artifacts."
            exit 1
          fi

          pr=$(gh api "repos/$repo/commits/$SHA/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SHA\")][0].number // empty")
          if [ -z "$pr" ]; then
            echo "No open PR has $SHA as its head; nothing to comment on."
            exit 0
          fi

          # The invisible marker line lets later pushes edit this comment.
          joined=$(printf ' | %s' "${links[@]}")
          cat > /tmp/preview-comment.md <<EOF
          <!-- preview-links -->
          <h3>$(gh api "repos/$repo/commits/$SHA" --jq '.commit.message' | head -1)</h3>
          Build artifact links for this commit: <strong>${joined:3}</strong>

          <em>This is an automated comment from the Preview Comment workflow.</em>
          EOF

          comment_id=$(gh api --paginate "repos/$repo/issues/$pr/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-links -->"))) | .id' | head -1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$repo/issues/comments/$comment_id" -F body=@/tmp/preview-comment.md > /dev/null
          else
            gh api "repos/$repo/issues/$pr/comments" -F body=@/tmp/preview-comment.md > /dev/null
          fi

      # Same marker as above, so the next successful run replaces this comment.
      # target_url is left out of the body because whoever posted the status controls it.
      - name: Comment that the preview links failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repo=palantir/blueprint

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          pr=$(gh api "repos/$repo/commits/$SHA/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SHA\")][0].number // empty")
          if [ -z "$pr" ]; then
            exit 0
          fi

          cat > /tmp/preview-comment.md <<EOF
          <!-- preview-links -->
          <h3>:warning: Preview links failed</h3>
          CircleCI's deploy-preview passed for $SHA, but this workflow could not post the preview links. Please check <a href="$RUN_URL">the workflow run</a>.

          <em>This is an automated comment from the Preview Comment workflow.</em>
          EOF

          comment_id=$(gh api --paginate "repos/$repo/issues/$pr/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-links -->"))) | .id' | head -1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$repo/issues/comments/$comment_id" -F body=@/tmp/preview-comment.md > /dev/null
          else
            gh api "repos/$repo/issues/$pr/comments" -F body=@/tmp/preview-comment.md > /dev/null
          fi
