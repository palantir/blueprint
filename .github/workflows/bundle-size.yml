name: Bundle Size

env:
  DO_NOT_TRACK: 1
  # The packages .size-limit.cjs measures; nx also builds what they depend on.
  PACKAGES: "@blueprintjs/core,@blueprintjs/icons,@blueprintjs/colors,@blueprintjs/datetime,@blueprintjs/select,@blueprintjs/table,@blueprintjs/labs"

# Runs the PR's code, so it gets no write token. bundle-size-comment.yml posts
# the result from develop's copy once this finishes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  measure:
    name: Measure bundle size
    if: github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The merge commit plus its first parent, the base branch tip.
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Cache Nx
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Install and build (PR)
        run: pnpm install && pnpm nx run-many -t compile -p "$PACKAGES"

      # On failure size-limit writes { "error": ... } instead of sizes; the
      # comment script reports it.
      - name: Measure bundle size (PR)
        run: mkdir -p /tmp/sizes && (pnpm exec size-limit --json > /tmp/sizes/current.json || cat /tmp/sizes/current.json)

      # Not pull_request.base.sha: that is the PR's recorded base, which goes
      # stale as the base branch moves and would count its changes as the PR's.
      - name: Checkout base branch
        run: git checkout HEAD^1

      - name: Install and build (base)
        run: pnpm clean && pnpm install && pnpm nx run-many -t compile -p "$PACKAGES"

      - name: Measure bundle size (base)
        run: pnpm exec size-limit --json > /tmp/sizes/base.json || cat /tmp/sizes/base.json

      - name: Upload measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size
          path: /tmp/sizes
          retention-days: 1

  # TEMP: exercises bundle-size-comment.yml's steps on this PR, since workflow_run
  # only runs develop's copy. Remove before merging.
  temp-comment:
    name: TEMP comment test
    needs: measure
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the comment script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-size
          path: /tmp/sizes

      - name: Compare and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected head sha '$SHA'."
            exit 1
          fi
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SHA\")][0].number // empty")
          if [ -z "$pr" ]; then
            echo "No open PR has $SHA as its head; nothing to comment on."
            exit 0
          fi

          node .github/scripts/bundle-size-comment.mjs /tmp/sizes/current.json /tmp/sizes/base.json > /tmp/comment.md
          comment_id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## size-limit report"))) | .id' | head -1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@/tmp/comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$pr/comments" -F body=@/tmp/comment.md > /dev/null
          fi
