# Policy for palantir/blueprint
#
# This policy splits approval rules by author type:
# - Palantir org members: trusted, approvals NOT invalidated on push
# - External contributors: stricter, approvals invalidated on push (except update merges)

policy:
  approval:
    - or:
        # Palantir org members - trusted
        - palantir member approved by one admin
        - palantir member approved by two admins (contributor allowed)
        # External contributors - stricter
        - external contributor approved by one admin
        - external contributor approved by two admins (contributor allowed)
        # Special cases
        - changelog only and contributor approval
        - fixing excavator
        - excavator only touched baseline, circle, gradle files, godel files, generated code, go dependencies, docker-compose-rule config or versions.props
        - excavator only touched config files
        - bots updated package.json and lock files
  disapproval:
    requires:
      organizations: ["palantir"]

approval_rules:
  # ============================================
  # PALANTIR ORG MEMBERS (trusted)
  # ============================================

  - name: palantir member approved by one admin
    description: >
      For PRs authored by Palantir org members. Approvals are not invalidated
      when new commits are pushed, as org members are trusted.
    options:
      allow_contributor: false
      invalidate_on_push: false
    if:
      has_author_in:
        organizations: ["palantir"]
    requires:
      count: 1
      permissions: ["admin", "maintain"]

  - name: palantir member approved by two admins (contributor allowed)
    description: >
      Alternative for Palantir members: allows the PR author to count as an
      approver (useful when a maintainer pushes fixes to someone's PR).
    options:
      allow_contributor: true
      invalidate_on_push: false
    if:
      has_author_in:
        organizations: ["palantir"]
    requires:
      count: 2
      permissions: ["admin", "maintain"]

  # ============================================
  # EXTERNAL CONTRIBUTORS (stricter rules)
  # ============================================

  - name: external contributor approved by one admin
    description: >
      For PRs from external contributors. Approvals are invalidated when new
      commits are pushed (except for update merges from the target branch).
    options:
      allow_contributor: false
      invalidate_on_push: true
      ignore_update_merges: false
    requires:
      count: 1
      permissions: ["admin", "maintain"]

  - name: external contributor approved by two admins (contributor allowed)
    description: >
      Alternative for external contributors: allows contributors to count as
      approvers. Approvals invalidated on push except for update merges.
    options:
      allow_contributor: true
      invalidate_on_push: true
      ignore_update_merges: true
    requires:
      count: 2
      permissions: ["admin", "maintain"]

  # ============================================
  # SPECIAL CASES (for all authors)
  # ============================================

  - name: changelog only and contributor approval
    options:
      allow_contributor: true
    requires:
      count: 1
      permissions: ["admin", "maintain"]
    if:
      only_changed_files:
        paths:
          - "changelog/@unreleased/.*\\.yml"

  - name: fixing excavator
    options:
      allow_contributor: true
    requires:
      count: 1
      permissions: ["admin", "maintain"]
    if:
      has_author_in:
        users: ["svc-excavator-bot", "dependabot[bot]"]

  - name: excavator only touched baseline, circle, gradle files, godel files, generated code, go dependencies, docker-compose-rule config or versions.props
    requires:
      count: 0
    if:
      has_author_in:
        users: ["svc-excavator-bot", "dependabot[bot]"]
      only_changed_files:
        # product-dependencies.lock should never go here, to force review of all product (SLS) dependency changes
        # this way excavator cannot change the deployability of a service or product via auto-merge
        paths:
          - "changelog/@unreleased/.*\\.yml"
          - "^\\.baseline/.*$"
          - "^(.+/)?Cargo.toml$"
          - "^Cargo.lock$"
          - "^\\.circleci/.*$"
          - "^\\.docker-compose-rule\\.yml$"
          - "^.*gradle$"
          - "^\\.palantir/go-version$"
          - "^gradle/wrapper/.*"
          - "^gradlew$"
          - "^gradlew.bat$"
          - "^gradle.properties$"
          - "^settings.gradle$"
          - "^.*go.mod$"
          - "^.*go.sum$"
          - "^.*godelw$"
          - "^.*godel/config/godel.properties$"
          - "^.*godel/config/godel.yml$"
          - "^gradle-jdks-latest/src/main/resources/latestjdks/latest-gradle-jdks.json$"
          - "^.*vendor/.*$"
          - "^versions.props$"
          - "^versions.lock$"
          - "^internal/generated/.*"
          - "^internal/generated_src/.*"
          - "^gradle-baseline-java/src/main/resources/checkstyle.version$"
      has_valid_signatures_by_keys:
        key_ids: ["C9AF124A484882E0", "4AEE18F83AFDEB23"]

  - name: excavator only touched config files
    requires:
      count: 0
    if:
      has_author_in:
        users: ["svc-excavator-bot"]
      only_changed_files:
        paths:
          - "^\\..*.yml$"
          - "^\\.github/.*$"
      has_valid_signatures_by_keys:
        key_ids: ["C9AF124A484882E0"]

  - name: bots updated package.json and lock files
    requires:
      count: 0
    if:
      has_author_in:
        users:
          - "svc-excavator-bot"
          - "dependabot[bot]"
      only_changed_files:
        paths:
          - "^.*yarn.lock$"
          - "^.*package.json$"
          - "^.*pnpm-lock.yaml$"
      has_valid_signatures_by_keys:
        key_ids: ["C9AF124A484882E0"]
