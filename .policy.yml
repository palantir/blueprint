# Policy for palantir/blueprint
#
# Blueprint team members are trusted: their approvals survive new pushes.
# External contributors are stricter: approvals are invalidated on push.

policy:
  approval:
    - or:
        - blueprint team member authored
        - external contributor authored
        - changelog only and contributor approval
        - fixing excavator
        - excavator only touched changelog or circle files
        - excavator only touched config files
        - bots updated package.json and lock files
  disapproval:
    requires:
      organizations: ["palantir"]

approval_rules:
  - name: blueprint team member authored
    description: >
      PRs by Blueprint team members. Approvals are not invalidated on push, and
      an admin author may self-approve.
    options:
      allow_contributor: true
      invalidate_on_push: false
      ignore_edited_comments: true
    if:
      has_author_in:
        teams: ["palantir/blueprint"]
    requires:
      count: 1
      permissions: ["admin", "maintain"]

  - name: external contributor authored
    description: >
      PRs from external contributors. Approvals are invalidated on push.
    options:
      allow_contributor: false
      invalidate_on_push: true
      ignore_update_merges: false
      ignore_edited_comments: true
    requires:
      count: 1
      permissions: ["admin", "maintain"]

  # Special cases (all authors)

  - name: changelog only and contributor approval
    options:
      allow_contributor: true
      ignore_edited_comments: true
    requires:
      count: 1
      permissions: ["admin", "maintain"]
    if:
      only_changed_files:
        paths:
          - "changelog/@unreleased/.*\\.yml"

  - name: fixing excavator
    options:
      allow_contributor: true
      ignore_edited_comments: true
    requires:
      count: 1
      permissions: ["admin", "maintain"]
    if:
      has_author_in:
        users: ["svc-excavator-bot", "dependabot[bot]"]

  - name: excavator only touched changelog or circle files
    requires:
      count: 0
    if:
      has_author_in:
        users: ["svc-excavator-bot", "dependabot[bot]"]
      only_changed_files:
        paths:
          - "changelog/@unreleased/.*\\.yml"
          - "^\\.circleci/.*$"
      has_valid_signatures_by_keys:
        key_ids: ["C9AF124A484882E0", "4AEE18F83AFDEB23"]

  - name: excavator only touched config files
    requires:
      count: 0
    if:
      has_author_in:
        users: ["svc-excavator-bot"]
      only_changed_files:
        paths:
          - "^\\..*.yml$"
          - "^\\.github/.*$"
      has_valid_signatures_by_keys:
        key_ids: ["C9AF124A484882E0"]

  - name: bots updated package.json and lock files
    requires:
      count: 0
    if:
      has_author_in:
        users:
          - "svc-excavator-bot"
          - "dependabot[bot]"
      only_changed_files:
        paths:
          - "^.*package.json$"
          - "^.*pnpm-lock.yaml$"
      has_valid_signatures_by_keys:
        key_ids: ["C9AF124A484882E0"]
